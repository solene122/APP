<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solène">
<title>Solène</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="ai-btn" onclick="toggleAI()">
<i data-lucide="sparkles"></i>
</div>
<div id="ai-panel">
<div id="ai-header">
<span id="ai-context-label">Assistant</span>
<button onclick="toggleAI()" id="ai-close"><i data-lucide="x"></i></button>
</div>
<div id="ai-messages"></div>
<div id="ai-input-area">
<input type="text" id="ai-input" placeholder="Pose ta question..." />
<button onclick="sendAIMessage()" id="ai-send"><i data-lucide="send"></i></button>
</div>
</div>
<div id="ai-overlay" onclick="toggleAI()"></div>
<div id="quick-add-overlay" onclick="closeQuickAdd()">
    <div id="quick-add-panel" onclick="event.stopPropagation()">
        <h3>✨ Ajouter rapidement</h3>
        <input type="text" id="quick-add-input" placeholder="Une idée, un livre, un défi, un voyage..." />
        <div class="quick-add-actions">
            <button class="btn-secondary" onclick="closeQuickAdd()">Annuler</button>
            <button class="btn-primary" onclick="classifierContenu()">Ajouter ✨</button>
        </div>
    </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
